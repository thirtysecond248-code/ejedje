name: Grass Fixed v5 (Selector Update)

on:
  workflow_dispatch: # Manual Start

jobs:
  grass-node:
    name: Grass-Worker-1
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Hours

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

    - name: Create Grass Bot Script
      run: |
        cat <<EOF > grass_bot.js
        const puppeteer = require('puppeteer-extra');
        const StealthPlugin = require('puppeteer-extra-plugin-stealth');
        puppeteer.use(StealthPlugin());

        (async () => {
          console.log("Launching Browser...");
          const browser = await puppeteer.launch({
            headless: "new",
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--ignore-certificate-errors']
          });
          
          const page = await browser.newPage();
          
          // 1. Go to Login
          console.log("Going to Grass Login...");
          try {
            // Timeout barha diya hai
            await page.goto('https://app.getgrass.io/login', {waitUntil: 'networkidle2', timeout: 90000});
          } catch (e) {
            console.log("Page load error (might be okay): " + e);
          }
          
          // 2. Type Credentials (UPDATED SELECTORS)
          console.log("Typing Credentials...");
          
          try {
            // Pehle purana selector try karega
            await page.waitForSelector('input[name="user"]', {timeout: 5000});
            await page.type('input[name="user"]', process.env.GRASS_USER);
            await page.type('input[name="password"]', process.env.GRASS_PASS);
          } catch (e) {
            console.log("Standard selector failed, trying placeholder method...");
            // Agar fail hua, to Placeholder text dhoond kar type karega
            await page.waitForSelector('input[placeholder="Username or Email"]', {timeout: 5000});
            await page.type('input[placeholder="Username or Email"]', process.env.GRASS_USER);
            await page.type('input[type="password"]', process.env.GRASS_PASS);
          }
          
          // 3. Click Login
          console.log("Clicking Login...");
          await page.keyboard.press('Enter'); // Enter dabana ziada reliable hai button click se
          
          // 4. Wait for Dashboard
          console.log("Waiting for dashboard...");
          await new Promise(r => setTimeout(r, 15000)); // Wait 15 seconds

          // 5. Take Screenshot (Evidence)
          console.log("Taking Screenshot...");
          await page.screenshot({path: 'grass_status.png'});
          console.log("Screenshot saved. Keeping session alive...");

          // 6. Keep Alive Loop (6 Hours)
          await new Promise(r => setTimeout(r, 21000000));
          
          await browser.close();
        })();
        EOF

    - name: Run Grass
      env:
        GRASS_USER: ${{ secrets.GRASS_USER }}
        GRASS_PASS: ${{ secrets.GRASS_PASS }}
      run: node grass_bot.js

    - name: Upload Screenshot Evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grass-evidence
        path: grass_status.png
